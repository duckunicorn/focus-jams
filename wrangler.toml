# Focus Jams sync server (Cloudflare Workers, free plan). The code is in relay/.
# This file sits at the top of the repository so Cloudflare's "Import a repository" works with its default settings.
name = "focus-jams"
main = "relay/worker.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "ARCHIVES"
class_name = "Archive"

# SQLite-backed Durable Objects are the kind included in the free plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# v2: the shared archive of nights and photos
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Archive"]

[observability]
enabled = true
